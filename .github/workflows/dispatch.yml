name: Baldy Cloud Executor Smoke
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      work_order_id:
        description: Synthetic work order id (for evidence correlation only)
        required: true

env:
  SWITCHBOARD_URL: https://baldy-switchboard-api.wyjjdyxzsc.workers.dev

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify expected HEAD is reachable
        run: git rev-parse HEAD

      - name: Create isolated mission branch
        run: |
          BRANCH="mission/${{ github.event.inputs.work_order_id }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Modify test fixture (scripted, deterministic change — no LLM involved)
        run: echo "counter=1" > fixture.txt

      - name: Run tests
        run: ./test_fixture.sh

      - name: Commit
        run: |
          git config user.email "cloud-executor@baldy-switchboard.test"
          git config user.name "Baldy Cloud Executor"
          git add fixture.txt
          git commit -m "09E smoke: cloud executor modified fixture for ${{ github.event.inputs.work_order_id }}"
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push mission branch
        run: git push origin "$BRANCH"

      - name: Report evidence to cloud control plane
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="COMPLETE"
            RESULT="commit_sha=$COMMIT_SHA branch=$BRANCH mac_used=NO"
          else
            STATUS="FAILED"
            RESULT="job did not complete successfully"
          fi
          curl -sf -X POST "$SWITCHBOARD_URL/api/workorders/${{ github.event.inputs.work_order_id }}/report" \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -d "{\"status\":\"$STATUS\",\"result\":\"$RESULT\",\"checkpoint\":\"$COMMIT_SHA\"}"
